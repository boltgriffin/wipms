<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WIPMS - Work Immersion Progress Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- The mark, inline so the tab icon needs no extra request and cannot 404 behind an SPA rewrite. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%230F766E'/%3E%3Crect x='9' y='4' width='6' height='16' rx='3' fill='%23fff'/%3E%3Crect x='17' y='14' width='6' height='14' rx='3' fill='%23F59E0B'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#093B37" />

    <!-- iOS installs from the Share sheet and ignores the manifest, so the home-screen name, the
         icon and the standalone behaviour have to be stated here as well. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WIPMS" />
    <meta name="application-name" content="WIPMS" />

    <script>
      // Paints the stored theme before the first frame, so there is no flash of the wrong one and the
      // sign-in page, which is outside the shell, is themed too. Wrapped because private windows can
      // make localStorage throw outright.
      try {
        var saved = JSON.parse(localStorage.getItem('wipms-ui') || '{}').state || {};
        var choice = saved.theme || 'system';
        var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var el = document.documentElement;
        el.classList.toggle('dark', dark);
        el.dataset.theme = dark ? 'dark' : 'light';
        el.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
